name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - v2
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'Attendance-system'
  NODE_VERSION: '20.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Compile TypeScript
        run: |
          cd backend
          npm run build

      - name: Prune dev dependencies for production
        run: |
          cd backend
          npm prune --omit=dev
          # Regenerate Prisma Client into production node_modules
          npx prisma generate

      - name: Assemble deployment bundle
        run: |
          mkdir -p ./deploy-package
          cp -r backend/dist ./deploy-package/
          cp -r backend/assets ./deploy-package/
          cp -r backend/prisma ./deploy-package/
          cp backend/package.json ./deploy-package/
          cp backend/package-lock.json ./deploy-package/
          cp -r backend/node_modules ./deploy-package/

      - name: Create ZIP archive for deployment
        run: |
          cd deploy-package
          zip -r -q ../backend-deploy.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: backend-deploy.zip
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROF}}
          package: backend-deploy.zip
